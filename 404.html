<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Peiyu Hung | Product &amp; UI/UX Designer</title>
    <!--
      SPA fallback for GitHub Pages project sites.
      GitHub Pages serves this 404.html for unknown sub-paths (e.g. /myportfolio/about).
      This script rewrites the URL into a query the app can decode, then redirects to
      the app root so React Router can render the correct route.
      pathSegmentsToKeep = 1 preserves the "/myportfolio" base segment.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>

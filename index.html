<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- SPA redirect decoder: restores the real route after the 404.html fallback redirect -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) — GA4. Page views are sent per route from React
         (send_page_view:false) so the SPA counts every page correctly. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y1LWYL5L99"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-Y1LWYL5L99', { send_page_view: false });
    </script>
